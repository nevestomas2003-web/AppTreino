<style>
/* Layout: ecrã único de telemóvel. Cabeçalho com data, conteúdo em cartões, barra de separadores em baixo. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#17211C; --muted:#5E6B64; --line:#D9DFD8;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --warn:#B45309; --prot:#3B5BDB; --good:#15803D;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512; --surface:#18211C; --ink:#E7EEE9; --muted:#93A39A; --line:#26332C;
    --accent:#3CC2A8; --accent-ink:#06201A; --warn:#F2A33A; --prot:#8EA2FF; --good:#5FD38A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512; --surface:#18211C; --ink:#E7EEE9; --muted:#93A39A; --line:#26332C;
  --accent:#3CC2A8; --accent-ink:#06201A; --warn:#F2A33A; --prot:#8EA2FF; --good:#5FD38A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body{min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}
.hrow .t{flex:1;min-width:0;text-align:center}
.hrow h1{font-size:26px;line-height:1.05;text-transform:capitalize}
.hrow .sub{font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .x{opacity:.7;font-size:18px;line-height:1}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.lbl{font-size:13px;color:var(--muted);font-weight:500}

.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-h h3{font-size:20px}
.target{font-family:var(--display);font-size:18px;color:var(--muted);white-space:nowrap}
.last{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr auto 44px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set .u{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.set input{text-align:center;font-variant-numeric:tabular-nums}
.ck{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.ck svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.set.warm .n{color:var(--accent);font-weight:700}
pre.sum{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin:0;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.set input.pre{color:var(--muted)}
.chip:disabled,.ib:disabled{opacity:.4;cursor:not-allowed}
.meal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.set.back .n{color:var(--prot);font-weight:700}
.set.back input{background:transparent;border-style:dashed}
.set.warm input{background:transparent;border-style:dashed}
.tg input{width:76px;min-height:36px;padding:4px 6px;text-align:center;font-family:var(--display);font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.set.done .ck{background:var(--accent);border-color:var(--accent)}
.set.done .ck svg{stroke:var(--accent-ink)}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.alt{background:transparent;color:var(--accent)}
.btn.sm{min-height:40px;padding:0 12px}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.progress.p > i{background:var(--prot)}
.progress.over > i{background:var(--warn)}
.big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.item .v{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.del{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1}
.slot-h{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;font-weight:600;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:26px;line-height:1}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .raw{fill:var(--muted)}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .end{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart text.gl{fill:var(--warn)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 0}
@media (prefers-reduced-motion:no-preference){.progress > i{transition:width .25s ease}}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="pt-tomas-v1";
var DOW=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
var MON=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

var PLAN={
  upperA:{name:"Upper A",ex:[

    {id:"curl_bic",n:"Curl de bíceps",s:3,r:[12,15]}]},
  lowerA:{name:"Lower A",ex:[
    {id:"agach",n:"Hack squat",s:3,r:[5,6]},
    {id:"pdl_rom",n:"Stiff",s:3,r:[6,8]},
    {id:"leg_press",n:"Leg press",s:3,r:[10,12]},
    {id:"curl_fem",n:"Curl femoral",s:3,r:[10,12]},
    {id:"gemeos",n:"Gémeos",s:3,r:[10,12]},
    {id:"core",n:"Core (prancha ou roda abdominal)",s:3,r:[10,15]}]},
  upperB:{name:"Upper B",ex:[
    {id:"pux_elev",n:"Lat pull down",s:3,r:[5,6]},
    {id:"sup_smith_inc",n:"Supino inclinado na Smith",s:3,r:[6,8]},
    {id:"rem_cabo",n:"Remada no cabo",s:3,r:[10,12]},
    {id:"peck_ind",n:"Peck deck individual",s:3,r:[6,8]},
    {id:"face_pull",n:"Face pull",s:3,r:[15,20]},
    {id:"elev_lat",n:"Elevações laterais",s:3,r:[12,15]},
    {id:"curl_mart",n:"Curl martelo",s:3,r:[12,15]},
    {id:"tric_fr",n:"Tríceps francês",s:3,r:[12,15]}]},
  lowerB:{name:"Lower B",ex:[
    {id:"hack",n:"Hack squat ou leg press",s:3,r:[5,6]},
    {id:"bulgaro",n:"Agachamento búlgaro (por perna)",s:3,r:[6,8]},
    {id:"hip_thrust",n:"Hip thrust",s:3,r:[8,10]},
    {id:"ext_perna",n:"Extensão de pernas",s:3,r:[12,15]},
    {id:"curl_fem",n:"Curl femoral",s:3,r:[12,15]},
    {id:"gemeos",n:"Gémeos",s:3,r:[12,15]}]}
};
var SESSIONS=[["lowerA","Lower A"],["upperA","Upper A"],["lowerB","Lower B"],["upperB","Upper B"],["corrida","Corrida"],["descanso","Descanso"]];
var WEEK={1:"lowerA",2:"upperA",3:"lowerB",4:"descanso",5:"upperB",6:"corrida",0:"descanso"};
var SLOTS=[["pa","Pequeno-almoço"],["mm","Meio da manhã"],["almoco","Almoço"],["mt","Meio da tarde"],["jantar","Jantar"],["folga","Folga 00h"]];

function mealsDefault(){
  return [
    {id:"m1",slot:"pa",name:"Aveia proteica",kcal:440,p:41,items:"40 g de aveia · 1 dose de Prozis · 1 banana · 200 ml de leite magro"},
    {id:"m2",slot:"pa",name:"Shake rápido",kcal:372,p:34,items:"1 dose de Prozis · 1 banana · 40 g de aveia · 250 ml de água"},
    {id:"m3",slot:"pa",name:"Ovos mexidos com pão e peru",kcal:395,p:35,items:"2 ovos + 2 claras · 2 fatias de pão integral · 50 g de fiambre de peru"},
    {id:"m4",slot:"mm",name:"Sandes de peru",kcal:260,p:24,items:"2 fatias de pão integral · 100 g de fiambre de peru · tomate e alface"},
    {id:"m5",slot:"mm",name:"Sandes de atum",kcal:250,p:26,items:"2 fatias de pão integral · 1 lata de atum ao natural · tomate"},
    {id:"m6",slot:"mm",name:"Sandes de ovo e peru",kcal:290,p:24,items:"2 fatias de pão integral · 50 g de fiambre de peru · 1 ovo cozido"},
    {id:"m7",slot:"mm",name:"Shake de Prozis com banana",kcal:222,p:29,items:"1 dose de Prozis · 1 banana · água"},
    {id:"m8",slot:"mm",name:"Barra de proteína",kcal:200,p:20,items:"1 barra (confirma os valores no rótulo)"},
    {id:"m9",slot:"almoco",name:"Frango, arroz e legumes",kcal:555,p:54,items:"150 g de frango · 150 g de arroz cozido · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m10",slot:"almoco",name:"Atum, massa e legumes",kcal:530,p:52,items:"2 latas de atum ao natural · 170 g de massa cozida · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m11",slot:"almoco",name:"Peru com batata",kcal:505,p:54,items:"200 g de bife de peru · 300 g de batata cozida · salada com 1 c. chá de azeite"},
    {id:"m12",slot:"mt",name:"Iogurte, granola e Prozis",kcal:381,p:42,items:"250 g de iogurte magro · 40 g de granola Fitness · 1 dose de Prozis"},
    {id:"m13",slot:"mt",name:"Skyr com maçã e nozes",kcal:340,p:29,items:"250 g de skyr · 1 maçã · 15 g de nozes"},
    {id:"m14",slot:"jantar",name:"Pescada com batata",kcal:420,p:42,items:"200 g de pescada · 200 g de batata cozida · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m15",slot:"jantar",name:"Frango no forno",kcal:460,p:45,items:"120 g de frango · 200 g de batata cozida · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m16",slot:"jantar",name:"Bife de peru",kcal:410,p:47,items:"180 g de bife de peru grelhado · 200 g de batata cozida · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m17",slot:"jantar",name:"Bacalhau com batata",kcal:450,p:44,items:"200 g de bacalhau cozido · 200 g de batata cozida · 200 g de legumes · 1 c. chá de azeite"},
    {id:"m18",slot:"jantar",name:"Atum com ovo",kcal:465,p:50,items:"2 latas de atum ao natural · 1 ovo cozido · 200 g de batata cozida · salada sem azeite"},
    {id:"m19",slot:"jantar",name:"Omelete com batata",kcal:445,p:32,items:"3 ovos + 2 claras · 200 g de batata cozida · 200 g de legumes"},
    {id:"m20",slot:"jantar",name:"Salmão com batata",kcal:470,p:33,items:"120 g de salmão · 200 g de batata cozida · 200 g de legumes"},
    {id:"m21",slot:"folga",name:"Sandes de peru",kcal:260,p:24,items:"2 fatias de pão integral · 100 g de fiambre de peru · tomate"},
    {id:"m22",slot:"folga",name:"Sandes de atum",kcal:250,p:26,items:"2 fatias de pão integral · 1 lata de atum ao natural · tomate"},
    {id:"m23",slot:"folga",name:"Ovos com pão",kcal:230,p:15,items:"2 ovos mexidos · 1 fatia de pão integral"},
    {id:"m24",slot:"folga",name:"Skyr com fruta",kcal:240,p:28,items:"250 g de skyr · 1 fruta"},
    {id:"m25",slot:"folga",name:"Iogurte com granola",kcal:221,p:14,items:"250 g de iogurte magro · 30 g de granola Fitness"}
  ];
}
function fixDays(days){
  days=(days&&typeof days==="object")?days:{};
  Object.keys(days).forEach(function(k){var f=days[k]&&days[k].food;if(Array.isArray(f))f.forEach(function(x){if(x.slot==="manha")x.slot="pa";else if(x.slot==="lanche")x.slot="mt";});});
  return days;
}
function defaults(){
  return {updated:0,
    settings:{kcal:2350,protein:170,goal:88},
    favs:[
      {name:"Whey, 1 dose",kcal:120,p:24},
      {name:"Iogurte grego 0%, 170 g",kcal:100,p:17},
      {name:"Skyr, 150 g",kcal:95,p:16},
      {name:"Ovo, 1 unidade",kcal:75,p:6},
      {name:"Banana",kcal:105,p:1},
      {name:"Aveia, 40 g",kcal:150,p:5},
      {name:"Pão integral, 1 fatia",kcal:80,p:3},
      {name:"Peito de frango, 150 g",kcal:250,p:46},
      {name:"Arroz cozido, 200 g",kcal:260,p:5},
      {name:"Atum ao natural, 1 lata",kcal:90,p:20}
    ],
    days:{},
    targets:{},
    meals:mealsDefault(),
    weights:[{date:"2026-11-23",kg:91.9}]};
}
function norm(d){
  var b=defaults();
  if(!d||typeof d!=="object") return b;
  var s=Object.assign(b.settings,d.settings||{});
  return {updated:d.updated||0,settings:s,
    favs:Array.isArray(d.favs)?d.favs:b.favs,
    days:fixDays(d.days),
    targets:(d.targets&&typeof d.targets==="object")?d.targets:{},
    meals:Array.isArray(d.meals)?d.meals:b.meals,
    weights:Array.isArray(d.weights)?d.weights:b.weights};
}
var S=defaults();

function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function parse(s){return new Date(s+"T12:00:00");}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:NaN;}
function fmt(n,d){return (Math.round(n*Math.pow(10,d||0))/Math.pow(10,d||0)).toString().replace(".",",");}

var TODAY=iso(new Date());
var ui={tab:"treino",date:TODAY,slot:(function(){var h=new Date().getHours();return (h>=23||h<5)?"folga":h<9?"pa":h<12?"mm":h<15?"almoco":h<19?"mt":"jantar";})(),editFav:false,editMeal:null,mdraft:{},confirmDel:null,
  draft:{name:"",kcal:"",p:"",fav:false},wdraft:{date:TODAY,kg:"",waist:""},status:"local"};

function dayR(dt){return S.days[dt]||{};}
function dayW(dt){return S.days[dt]||(S.days[dt]={});}
function sessionOf(dt){var d=S.days[dt];return (d&&d.session)||WEEK[parse(dt).getDay()];}

/* ---------- armazenamento ---------- */
var APPKEY="pt-app-key";
function remoteRef(){
  var k="";try{k=localStorage.getItem(APPKEY)||"";}catch(e){}
  if(!k)return null;
  return {
    get:function(){return fetch("/api/data",{headers:{"x-app-key":k},cache:"no-store"}).then(function(r){if(r.status===401){try{localStorage.removeItem(APPKEY);}catch(e){}ui.needKey=true;render();throw new Error("401");}if(!r.ok)throw new Error("http");return r.json();}).then(function(j){return j.data;});},
    set:function(d){return fetch("/api/data",{method:"PUT",headers:{"x-app-key":k,"content-type":"application/json"},body:JSON.stringify({data:d})}).then(function(r){if(r.status===401){try{localStorage.removeItem(APPKEY);}catch(e){}ui.needKey=true;render();throw new Error("401");}if(!r.ok)throw new Error("http");});}
  };
}
function adopt(d){
  if(d&&d.days){
    var remote=norm(d);
    if((remote.updated||0)>(S.updated||0)){S=remote;if(prune())S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();flush();}
    else{flush();}
  }else{
    if(!S.updated)S.updated=Date.now();
    flush();
  }
  setStatus("cloud");
}
function initRemote(){
  var r=remoteRef();
  if(!r){ui.needKey=true;render();return;}
  dbRef=r;
  Promise.race([r.get(),new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},10000);})]).then(adopt).catch(function(){dbRef=null;setStatus(ui.needKey?"local":"error");});
}
var dbRef=null,writing=false,pending=false,timer=null;
function setStatus(s){ui.status=s;var el=document.getElementById("stat");if(el)el.textContent=statusText();}
function statusText(){return "Versão 23 · "+(ui.status==="cloud"?"Guardado na tua conta":ui.status==="error"?"Erro a guardar na conta. Os dados ficam neste dispositivo.":"Guardado só neste dispositivo");}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(timer);timer=setTimeout(flush,800);
}
function flush(){
  if(!dbRef)return;
  if(writing){pending=true;return;}
  writing=true;
  var p;
  try{p=Promise.resolve(dbRef.set(JSON.parse(JSON.stringify(S))));}catch(e){p=Promise.reject(e);}
  p.then(function(){setStatus("cloud");},function(){setStatus("error");}).then(function(){writing=false;if(pending){pending=false;flush();}});
}
function readSnap(s){
  if(!s)return null;
  var ex=typeof s.exists==="function"?s.exists():s.exists;
  if(ex===false)return null;
  var d=typeof s.data==="function"?s.data():(s.data||s);
  return d&&typeof d==="object"?d:null;
}
function initStore(){
  try{var raw=localStorage.getItem(KEY);if(raw){S=norm(JSON.parse(raw));}}catch(e){}
  prune();
  render();
  if(!(window.claude&&window.claude.use)){initRemote();return;}
  Promise.resolve(window.claude.use("db")).then(function(db){
    if(!db)return;
    dbRef=db.collection("tracker").doc("main");
    return Promise.race([Promise.resolve(dbRef.get()),new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},10000);})]).then(function(snap){
      var d=readSnap(snap);
      if(d&&d.days){
        var remote=norm(d);
        if((remote.updated||0)>(S.updated||0)){S=remote;if(prune())S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();flush();}
        else{flush();}
      }else{
        if(!S.updated)S.updated=Date.now();
        flush();
      }
      setStatus("cloud");
    });
  }).catch(function(){setStatus(dbRef?"error":"local");});
}

/* ---------- treino ---------- */
function lastSets(exId,dt){
  var keys=Object.keys(S.days).filter(function(k){return k<dt;}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var d=S.days[keys[i]];var arr=d&&d.sets&&d.sets[exId];
    if(arr&&arr.some(function(s){return s&&(s.kg||s.reps);}))return arr;
  }
  return null;
}
function lastWarm(exId,dt){
  var keys=Object.keys(S.days).filter(function(k){return k<dt;}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var d=S.days[keys[i]];var arr=d&&d.warm&&d.warm[exId];
    if(arr&&arr.some(function(w){return w&&(w.kg||w.reps);}))return arr;
  }
  return null;
}
function tgt(ex){var v=S.targets&&S.targets[ex.id];return v!=null&&v!==""?v:ex.r[0]+(ex.r[1]!==ex.r[0]?"-"+ex.r[1]:"");}
function tgtMax(ex){var n=String(tgt(ex)).match(/\d+/g);return n?Math.max.apply(null,n.map(Number)):ex.r[1];}
function lastBack(exId,dt){
  var keys=Object.keys(S.days).filter(function(k){return k<dt;}).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var d=S.days[keys[i]];var arr=d&&d.back&&d.back[exId];
    if(arr&&arr.some(function(w){return w&&(w.kg||w.reps);}))return arr;
  }
  return null;
}
function fmtT(ms){
  var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;
  return h>0?h+":"+(m<10?"0":"")+m+":"+(sec<10?"0":"")+sec:m+":"+(sec<10?"0":"")+sec;
}
function elapsed(dd){var t=dd.timer||{};return (t.acc||0)+(t.start?Date.now()-t.start:0);}
function timerCard(dd){
  var t=dd.timer||{},run=!!t.start,el=elapsed(dd);
  return '<section class="card"><div class="row"><div class="grow"><div class="lbl">Duração do treino'+(run?" · a contar":"")+'</div><div class="big num" id="tmr">'+fmtT(el)+'</div></div>'+
    '<button class="btn" data-act="tplay" style="min-width:110px">'+(run?"Pausar":el>0?"Retomar":"Iniciar")+'</button>'+
    (!run&&el>0?'<button class="btn alt" data-act="treset">Repor</button>':'')+'</div></section>';
}
function sessStats(dd,ses){
  var plan=PLAN[ses],n=0,vol=0;
  if(!plan)return {n:0,vol:0};
  plan.ex.forEach(function(ex){((dd.sets&&dd.sets[ex.id])||[]).forEach(function(s){
    if(s&&s.done)n++;
    var k=num(s&&s.kg),r=num(s&&s.reps);
    if(s&&(s.done||s.kg||s.reps)&&isFinite(k)&&isFinite(r))vol+=k*r;
  });});
  return {n:n,vol:vol};
}
function summary(dt){
  var d=dayR(dt),ses=sessionOf(dt),plan=PLAN[ses];
  if(!plan)return "";
  function fm(arr){return (arr||[]).filter(function(x){return x&&(x.kg||x.reps);}).map(function(x){return (x.kg||"?")+"×"+(x.reps||"?");});}
  var lines=[dateLabel(dt)+" · "+plan.name+" · "+fmtT(elapsed(d))];
  plan.ex.forEach(function(ex){
    var a=fm(d.warm&&d.warm[ex.id]),w=fm(d.sets&&d.sets[ex.id]),b=fm(d.back&&d.back[ex.id]);
    if(!a.length&&!w.length&&!b.length)return;
    lines.push(ex.n+": "+(a.length?"aquec. "+a.join(", ")+" | ":"")+w.join(", ")+(b.length?" | back off "+b.join(", "):""));
  });
  if(d.note)lines.push("Notas: "+d.note);
  return lines.join("\n");
}
function finishCard(dd,ses){
  if(dd.finished){
    var st=sessStats(dd,ses);
    return '<section class="card"><h2>Treino guardado</h2><div class="stats">'+
      '<div class="stat"><span class="lbl">Duração</span><b class="num">'+fmtT(elapsed(dd))+'</b></div>'+
      '<div class="stat"><span class="lbl">Séries</span><b class="num">'+st.n+'</b></div>'+
      '<div class="stat"><span class="lbl">Volume</span><b class="num">'+Math.round(st.vol)+' kg</b></div></div>'+
      '<pre class="sum" id="sum">'+esc(summary(ui.date))+'</pre>'+
      '<div class="btns"><button class="btn sm" data-act="copysum" id="copybtn">Copiar resumo</button><button class="btn alt sm" data-act="reopen">Reabrir treino</button></div></section>';
  }
  return '<section class="card"><button class="btn" data-act="finish">Terminar treino</button><div class="lbl">Pára o cronómetro e guarda o treino na tua conta.</div></section>';
}
function locked(dt){
  var d=dayR(dt),t=d.timer||{};

}
function prune(){

    var d=S.days[k];if(!d||!d.session)return;
    var only=Object.keys(d).length===1;

function paceText(r){

  var list=S.meals.filter(function(m){return m.slot===ui.slot;});

  if(!list.length)h+='<p class="muted" style="margin:0">Ainda sem opções aqui. Toca em Nova para criar uma.</p>';
  list.forEach(function(m){
    if(ui.editMeal===m.id){
      var d=ui.mdraft;
      h+='<div class="meal"><div><label class="lbl" for="mn">Nome</label><input id="mn" type="text" data-md="name" value="'+esc(d.name)+'"></div>'+
        '<div class="two"><div><label class="lbl" for="mk">Calorias (kcal)</label><input id="mk" type="text" inputmode="numeric" data-md="kcal" value="'+esc(d.kcal)+'"></div>'+
        '<div><label class="lbl" for="mp">Proteína (g)</label><input id="mp" type="text" inputmode="decimal" data-md="p" value="'+esc(d.p)+'"></div></div>'+
        '<div><label class="lbl" for="mi">Alimentos e quantidades</label><textarea id="mi" rows="3" data-md="items">'+esc(d.items)+'</textarea></div>'+
        '<div><label class="lbl" for="ms">Momento do dia</label><select id="ms" data-md="slot">'+SLOTS.map(function(s){return '<option value="'+s[0]+'"'+(d.slot===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select></div>'+
        '<div class="btns"><button class="btn sm" data-act="savemeal">Guardar</button><button class="btn alt sm" data-act="cancelmeal">Cancelar</button>'+
        '<button class="btn alt sm" data-act="delmeal" data-id="'+esc(m.id)+'">'+(ui.confirmDel===m.id?"Tocar para confirmar":"Apagar")+'</button></div></div>';
    }else{
      h+='<div class="meal"><div class="ex-h"><h3>'+esc(m.name)+'</h3><span class="target num">'+Math.round(m.kcal)+' kcal · '+fmt(+m.p,0)+' g</span></div>'+
        (m.items?'<div class="last">'+esc(m.items)+'</div>':"")+
        '<div class="btns"><button class="btn sm" data-act="addmeal" data-id="'+esc(m.id)+'">Adicionar ao dia</button><button class="btn alt sm" data-act="editmeal" data-id="'+esc(m.id)+'">Editar</button></div></div>';
    }
  });
  return h+'<div class="lbl">Valores aproximados. Edita-os para o que realmente comes.</div></section>';
}
function slotName(k){for(var i=0;i<SLOTS.length;i++)if(SLOTS[i][0]===k)return SLOTS[i][1];return k;}
function addFood(name,kcal,p,items){
  var d=dayW(ui.date);d.food=d.food||[];
  d.food.push({slot:ui.slot,name:name,kcal:kcal,p:p,items:items||""});
  save();
}

/* ---------- peso ---------- */
function sortedW(){return S.weights.filter(function(x){return x&&isFinite(x.kg);}).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}
function avg7(w){
  var last=w[w.length-1];if(!last)return NaN;
  var t=parse(last.date).getTime();
  var a=w.filter(function(q){var d=parse(q.date).getTime();return d<=t&&d>t-7*864e5;});
  return a.reduce(function(s,q){return s+q.kg;},0)/a.length;
}
function chart(w){
  if(!w.length)return '<p class="muted" style="margin:0">Sem registos.</p>';
  var W=340,H=180,L=34,R=12,T=12,B=26;
  var t=function(x){return parse(x).getTime();};
  var t0=t(w[0].date),t1=t(w[w.length-1].date);
  var avg=w.map(function(p){var tt=t(p.date);var arr=w.filter(function(q){var d=t(q.date);return d<=tt&&d>tt-7*864e5;});return {date:p.date,kg:arr.reduce(function(a,q){return a+q.kg;},0)/arr.length};});
  var vals=w.map(function(p){return p.kg;}).concat([S.settings.goal]);
  var lo=Math.floor(Math.min.apply(null,vals)-1),hi=Math.ceil(Math.max.apply(null,vals)+1);
  var X=function(d){return t1===t0?L+(W-L-R)/2:L+(t(d)-t0)/(t1-t0)*(W-L-R);};
  var Y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B);};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico do peso ao longo do tempo">';
  s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(hi)+'" y2="'+Y(hi)+'"/><line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(lo)+'" y2="'+Y(lo)+'"/>';
  s+='<text x="'+(L-4)+'" y="'+(Y(hi)+4)+'" text-anchor="end">'+hi+'</text><text x="'+(L-4)+'" y="'+(Y(lo)+4)+'" text-anchor="end">'+lo+'</text>';
  s+='<line class="goal" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(S.settings.goal)+'" y2="'+Y(S.settings.goal)+'"/>';
  s+='<text class="gl" x="'+(W-R)+'" y="'+(Y(S.settings.goal)-4)+'" text-anchor="end">objetivo '+fmt(S.settings.goal,1)+'</text>';
  w.forEach(function(p){s+='<circle class="raw" cx="'+X(p.date).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="3"/>';});
  if(avg.length>1)s+='<polyline class="avg" points="'+avg.map(function(p){return X(p.date).toFixed(1)+","+Y(p.kg).toFixed(1);}).join(" ")+'"/>';
  var e=avg[avg.length-1];
  s+='<circle class="end" cx="'+X(e.date).toFixed(1)+'" cy="'+Y(e.kg).toFixed(1)+'" r="5"/>';
  var d0=parse(w[0].date),d1=parse(w[w.length-1].date);
  s+='<text x="'+L+'" y="'+(H-6)+'">'+d0.getDate()+" "+MON[d0.getMonth()]+'</text>';
  if(t1!==t0)s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+d1.getDate()+" "+MON[d1.getMonth()]+'</text>';
  return s+'</svg>';
}
function viewPeso(){
  var w=sortedW(),goal=S.settings.goal;
  var cur=w.length?w[w.length-1].kg:NaN,first=w.length?w[0].kg:NaN,a=avg7(w);
  var h='<section class="card"><div class="stats">'+
    '<div class="stat"><span class="lbl">Último</span><b class="num">'+(isFinite(cur)?fmt(cur,1):"–")+' <small class="muted" style="font-size:14px">kg</small></b></div>'+
    '<div class="stat"><span class="lbl">Média 7 dias</span><b class="num">'+(isFinite(a)?fmt(a,1):"–")+'</b></div>'+
    '<div class="stat"><span class="lbl">Até ao objetivo</span><b class="num">'+(isFinite(a)?(a-goal>0?fmt(a-goal,1)+" kg":"Atingido"):"–")+'</b></div></div>'+
    (w.length>1?'<div class="lbl num">Desde o início: '+(cur-first>0?"+":"")+fmt(cur-first,1)+' kg</div>':'')+
    chart(w)+'<div class="lbl">Linha verde: média móvel de 7 dias. Pontos: pesagens. Pesa-te de manhã, em jejum, e vê a tendência, não o dia.</div></section>';

  h+='<section class="card"><h2>Registar peso</h2><div class="two">'+
    '<div><label class="lbl" for="wd">Data</label><input id="wd" type="date" data-wd="date" value="'+esc(ui.wdraft.date)+'"></div>'+
    '<div><label class="lbl" for="wk">Peso (kg)</label><input id="wk" type="text" inputmode="decimal" data-wd="kg" value="'+esc(ui.wdraft.kg)+'" placeholder="91,5"></div></div>'+
    '<div><label class="lbl" for="ww">Cintura (cm), opcional</label><input id="ww" type="text" inputmode="decimal" data-wd="waist" value="'+esc(ui.wdraft.waist)+'"></div>'+
    '<button class="btn" data-act="addw">Guardar</button></section>';

  h+='<section class="card"><h2>Objetivos diários</h2><div class="two">'+
    '<div><label class="lbl" for="sk">Calorias (kcal)</label><input id="sk" type="text" inputmode="numeric" data-set="kcal" value="'+S.settings.kcal+'"></div>'+
    '<div><label class="lbl" for="sp">Proteína (g)</label><input id="sp" type="text" inputmode="numeric" data-set="protein" value="'+S.settings.protein+'"></div></div>'+
    '<div><label class="lbl" for="sg">Peso objetivo (kg)</label><input id="sg" type="text" inputmode="decimal" data-set="goal" value="'+fmt(S.settings.goal,1)+'"></div></section>';

  h+='<section class="card"><h2>Histórico</h2>';
  var wr=w.slice().reverse();
  if(!wr.length)h+='<p class="muted" style="margin:0">Sem registos.</p>';
  wr.slice(0,30).forEach(function(x){
    var d=parse(x.date);
    h+='<div class="item"><span class="nm">'+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()+'</span><span class="v num">'+fmt(x.kg,1)+' kg'+(x.waist?" · "+fmt(x.waist,1)+" cm":"")+'</span>'+
       '<button class="del" data-act="delw" data-d="'+esc(x.date)+'" aria-label="Apagar registo">×</button></div>';
  });
  return h+'</section>';
}

/* ---------- render ---------- */
function render(){
  renderHdr();renderTabs();
  var app=document.getElementById("app");
  app.innerHTML=(ui.tab==="treino"?viewTreino():ui.tab==="comida"?viewComida():viewPeso())+'<div class="status" id="stat">'+statusText()+'</div>';
  if(ui.needKey){app.insertAdjacentHTML("afterbegin",'<section class="card"><h2>Ligar à base de dados</h2><p class="muted">Escreve a chave da app para guardar os dados na nuvem.</p><input id="keyin" type="password" autocomplete="off" autocapitalize="off" placeholder="Chave"><div class="btns"><button class="btn sm" data-act="savekey">Guardar chave</button></div></section>');}
}

/* ---------- eventos ---------- */
function shift(n){var d=parse(ui.date);d.setDate(d.getDate()+n);ui.date=iso(d);render();window.scrollTo(0,0);}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),i=+b.getAttribute("data-i");
  if((a==="ses"||a==="prev"||a==="next"||a==="today")&&locked(ui.date))return;
  if(a==="tab"){ui.tab=v;render();window.scrollTo(0,0);}
  else if(a==="prev")shift(-1);
  else if(a==="next")shift(1);
  else if(a==="today"){ui.date=TODAY;render();}
  else if(a==="ses"){dayW(ui.date).session=v;save();render();}
  else if(a==="ck"){
    var ex=b.getAttribute("data-ex"),d=dayW(ui.date);
    d.sets=d.sets||{};d.sets[ex]=d.sets[ex]||[];
    var s=d.sets[ex][i]=d.sets[ex][i]||{};
    s.done=!s.done;
    if(s.done){
      var l=lastSets(ex,ui.date),src=(l&&(l[i]||l[l.length-1]))||d.sets[ex][i-1]||{};
      if(s.kg===undefined||s.kg==="")s.kg=src.kg||"";
      if(s.reps===undefined||s.reps==="")s.reps=src.reps||"";
      if(s.reps===""){
        s.done=false;save();render();
        var inp=document.querySelector('input[data-ex="'+ex+'"][data-i="'+i+'"][data-f="reps"]');
        if(inp)inp.focus();
        return;
      }
    }
    save();render();
  }
  else if(a==="ckw"){
    var exw=b.getAttribute("data-ex"),dw=dayW(ui.date);
    dw.warm=dw.warm||{};dw.warm[exw]=dw.warm[exw]||[];
    var w=dw.warm[exw][i]=dw.warm[exw][i]||{};
    w.done=!w.done;
    if(w.done){var l2=lastWarm(exw,ui.date),sr=(l2&&(l2[i]||l2[l2.length-1]))||{};if(w.kg===undefined||w.kg==="")w.kg=sr.kg||"";if(w.reps===undefined||w.reps==="")w.reps=sr.reps||"";}
    save();render();
  }
  else if(a==="addwarm"){var ew=b.getAttribute("data-ex"),dx=dayW(ui.date);dx.warm=dx.warm||{};dx.warm[ew]=dx.warm[ew]||[];dx.warm[ew].push({});save();render();}
  else if(a==="delwarm"){var ev=b.getAttribute("data-ex"),dv=dayW(ui.date);if(dv.warm&&dv.warm[ev]){dv.warm[ev].pop();save();render();}}
  else if(a==="addset"){
    var es=b.getAttribute("data-ex"),n0=+b.getAttribute("data-n"),dsx=dayW(ui.date);
    dsx.sets=dsx.sets||{};var arr=dsx.sets[es]=dsx.sets[es]||[];
    while(arr.length<n0)arr.push({});arr.push({});save();render();
  }
  else if(a==="ckb"){
    var exb=b.getAttribute("data-ex"),db2=dayW(ui.date);
    db2.back=db2.back||{};db2.back[exb]=db2.back[exb]||[];
    var bk=db2.back[exb][i]=db2.back[exb][i]||{};
    bk.done=!bk.done;
    if(bk.done){var l3=lastBack(exb,ui.date),sb=(l3&&(l3[i]||l3[l3.length-1]))||{};if(bk.kg===undefined||bk.kg==="")bk.kg=sb.kg||"";if(bk.reps===undefined||bk.reps==="")bk.reps=sb.reps||"";}
    save();render();
  }
  else if(a==="addback"){var eb=b.getAttribute("data-ex"),dy=dayW(ui.date);dy.back=dy.back||{};dy.back[eb]=dy.back[eb]||[];dy.back[eb].push({});save();render();}
  else if(a==="delback"){var ed=b.getAttribute("data-ex"),dz=dayW(ui.date);if(dz.back&&dz.back[ed]){dz.back[ed].pop();save();render();}}
  else if(a==="delset"){var el2=b.getAttribute("data-ex"),dq=dayW(ui.date);if(dq.sets&&dq.sets[el2]&&dq.sets[el2].length>3){dq.sets[el2].pop();save();render();}}
  else if(a==="tplay"){
    var dt2=dayW(ui.date),tm=dt2.timer=dt2.timer||{acc:0,start:null};
    if(tm.start){tm.acc=(tm.acc||0)+Date.now()-tm.start;tm.start=null;}else{tm.start=Date.now();}
    save();render();
  }
  else if(a==="treset"){dayW(ui.date).timer={acc:0,start:null};save();render();}
  else if(a==="finish"){
    var df=dayW(ui.date),tf=df.timer;
    if(tf&&tf.start){tf.acc=(tf.acc||0)+Date.now()-tf.start;tf.start=null;}
    df.finished=Date.now();save();clearTimeout(timer);flush();render();window.scrollTo(0,document.body.scrollHeight);
  }
  else if(a==="reopen"){delete dayW(ui.date).finished;save();render();}
  else if(a==="savekey"){var ki=document.getElementById("keyin");var kv=ki?ki.value.trim():"";if(kv){try{localStorage.setItem(APPKEY,kv);}catch(e){}ui.needKey=false;render();initRemote();}}
  else if(a==="copysum"){
    var txt=summary(ui.date),bt=document.getElementById("copybtn");
    function done(m){if(bt)bt.textContent=m;}
    try{navigator.clipboard.writeText(txt).then(function(){done("Copiado");},function(){done("Seleciona o texto acima");});}catch(err){done("Seleciona o texto acima");}
  }
  else if(a==="addmeal"){var mA=findMeal(b.getAttribute("data-id"));if(mA){addFood(mA.name,mA.kcal,mA.p,mA.items);render();}}
  else if(a==="editmeal"){var mB=findMeal(b.getAttribute("data-id"));if(mB){ui.editMeal=mB.id;ui.confirmDel=null;ui.mdraft={name:mB.name,kcal:String(mB.kcal),p:String(mB.p),items:mB.items||"",slot:mB.slot};render();}}
  else if(a==="newmeal"){var mC={id:"m"+Date.now(),name:"Nova refeição",slot:ui.slot,kcal:0,p:0,items:""};S.meals.unshift(mC);ui.editMeal=mC.id;ui.confirmDel=null;ui.mdraft={name:mC.name,kcal:"",p:"",items:"",slot:mC.slot};save();render();}
  else if(a==="savemeal"){
    var mD=findMeal(ui.editMeal),dm=ui.mdraft,kD=num(dm.kcal),pD=num(dm.p);
    if(mD){
      if(!String(dm.name).trim()||!isFinite(kD)){var f1=document.getElementById(String(dm.name).trim()?"mk":"mn");if(f1)f1.focus();return;}
      mD.name=String(dm.name).trim();mD.kcal=kD;mD.p=isFinite(pD)?pD:0;mD.items=dm.items;mD.slot=dm.slot;
      ui.editMeal=null;ui.confirmDel=null;save();render();
    }
  }
  else if(a==="cancelmeal"){ui.editMeal=null;ui.confirmDel=null;render();}
  else if(a==="delmeal"){
    var idE=b.getAttribute("data-id");
    if(ui.confirmDel===idE){S.meals=S.meals.filter(function(x){return x.id!==idE;});ui.editMeal=null;ui.confirmDel=null;save();render();}
    else{ui.confirmDel=idE;render();}
  }
  else if(a==="rundone"){var r=dayW(ui.date).run=dayW(ui.date).run||{};r.done=!r.done;save();render();}
  else if(a==="slot"){ui.slot=v;render();}
  else if(a==="editfav"){ui.editFav=!ui.editFav;render();}
  else if(a==="delfav"){S.favs.splice(i,1);save();render();}
  else if(a==="fav"){var f=S.favs[i];if(f){addFood(f.name,f.kcal,f.p);render();}}
  else if(a==="addfood"){
    var dr=ui.draft,k=num(dr.kcal),p=num(dr.p);
    if(!dr.name.trim()||!isFinite(k)){var el=document.getElementById(dr.name.trim()?"fk":"fname");if(el)el.focus();return;}
    if(!isFinite(p))p=0;
    addFood(dr.name.trim(),k,p);
    if(dr.fav){S.favs.push({name:dr.name.trim(),kcal:k,p:p});}
    ui.draft={name:"",kcal:"",p:"",fav:false};save();render();
  }
  else if(a==="delfood"){var d2=dayW(ui.date);d2.food.splice(i,1);save();render();}
  else if(a==="addw"){
    var kg=num(ui.wdraft.kg);
    if(!isFinite(kg)||kg<30||kg>300){var e2=document.getElementById("wk");if(e2)e2.focus();return;}
    var wa=num(ui.wdraft.waist),dt=ui.wdraft.date||TODAY;
    S.weights=S.weights.filter(function(x){return x.date!==dt;});
    var o={date:dt,kg:kg};if(isFinite(wa))o.waist=wa;
    S.weights.push(o);
    ui.wdraft={date:TODAY,kg:"",waist:""};save();render();
  }
  else if(a==="delw"){var dd=b.getAttribute("data-d");S.weights=S.weights.filter(function(x){return x.date!==dd;});save();render();}
});
document.addEventListener("focusin",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("pre"))setTimeout(function(){try{t.select();}catch(x){}},0);
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.classList)t.classList.remove("pre");
  if(t.hasAttribute("data-bx")){
    var bx=t.getAttribute("data-bx"),bi=+t.getAttribute("data-i"),bf=t.getAttribute("data-f"),dbx=dayW(ui.date);
    dbx.back=dbx.back||{};dbx.back[bx]=dbx.back[bx]||[];
    var bb=dbx.back[bx][bi]=dbx.back[bx][bi]||{};bb[bf]=t.value;save();
  }
  else if(t.hasAttribute("data-tg")){S.targets=S.targets||{};S.targets[t.getAttribute("data-tg")]=t.value;save();}
  else if(t.hasAttribute("data-wx")){
    var wx=t.getAttribute("data-wx"),wi=+t.getAttribute("data-i"),wf=t.getAttribute("data-f"),dwx=dayW(ui.date);
    dwx.warm=dwx.warm||{};dwx.warm[wx]=dwx.warm[wx]||[];
    var ww=dwx.warm[wx][wi]=dwx.warm[wx][wi]||{};ww[wf]=t.value;save();
  }
  else if(t.hasAttribute("data-ex")){
    var ex=t.getAttribute("data-ex"),i=+t.getAttribute("data-i"),f=t.getAttribute("data-f"),d=dayW(ui.date);
    d.sets=d.sets||{};d.sets[ex]=d.sets[ex]||[];
    var s=d.sets[ex][i]=d.sets[ex][i]||{};s[f]=t.value;save();
  }
  else if(t.hasAttribute("data-run")){var r=dayW(ui.date).run=dayW(ui.date).run||{};r[t.getAttribute("data-run")]=t.value;save();var p=document.getElementById("pace");if(p)p.textContent=paceText(r);}
  else if(t.hasAttribute("data-day")){dayW(ui.date)[t.getAttribute("data-day")]=t.value;save();}
  else if(t.hasAttribute("data-md")){ui.mdraft[t.getAttribute("data-md")]=t.value;}
  else if(t.hasAttribute("data-draft")){var k=t.getAttribute("data-draft");ui.draft[k]=t.type==="checkbox"?t.checked:t.value;}
  else if(t.hasAttribute("data-wd")){ui.wdraft[t.getAttribute("data-wd")]=t.value;}
  else if(t.hasAttribute("data-set")){
    var key=t.getAttribute("data-set"),n=num(t.value);
    if(isFinite(n)&&n>0){S.settings[key]=n;save();}
  }
});
document.addEventListener("change",function(e){
  if(e.target.hasAttribute("data-ex")||e.target.id==="ffav"){updSets();}
});
document.addEventListener("focusout",function(e){if(e.target.hasAttribute&&e.target.hasAttribute("data-ex"))updSets();});

document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;
  var n=iso(new Date());
  if(n===TODAY)return;
  var wasToday=ui.date===TODAY;
  TODAY=n;if(wasToday)ui.date=n;
  if(!ui.wdraft.kg)ui.wdraft.date=n;
  render();
});
setInterval(function(){
  var el=document.getElementById("tmr");
  if(el&&ui.tab==="treino")el.textContent=fmtT(elapsed(dayR(ui.date)));
},1000);
initStore();
})();
</script>
